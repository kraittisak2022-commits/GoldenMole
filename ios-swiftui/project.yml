name: GoldenmoleDashboard
options:
  bundleIdPrefix: com.goldenmole
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.goldenmole.dashboard
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    VERSIONING_SYSTEM: apple-generic
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
targets:
  GoldenmoleDashboard:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: Goldenmole Dashboard
        GENERATE_INFOPLIST_FILE: NO
