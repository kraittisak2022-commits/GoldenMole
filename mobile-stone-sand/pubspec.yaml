name: mobile_stone_sand
description: "ระบบจัดการออเดอร์ หิน-ทราย (Android / iOS)"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.7
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/
    - assets/geo/
    - assets/fonts/

  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/app_icon_foreground.png
  color_dark: "#FFFFFF"
  image_dark: assets/branding/app_icon_foreground.png
  ios: true
  android: true
  android_12:
    image: assets/branding/app_icon_foreground.png
    color: "#FFFFFF"
    image_dark: assets/branding/app_icon_foreground.png
    color_dark: "#FFFFFF"
