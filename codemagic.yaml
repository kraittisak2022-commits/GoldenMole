# Goldenmole Dashboard — Codemagic iOS workflow
# Docs: https://docs.codemagic.io/yaml-code-signing/signing-ios/
# Setup guide: docs/codemagic-setup.md
# Flutter User app: docs/codemagic-user-ios-setup.md (workflows goldenmole-user-ios*)
#
# One-time setup:
# 1. App ID com.goldenmole.dashboard in Apple Developer → Identifiers
# 2. Team integrations → Developer Portal → API key named "codemagic"
# 3. Env group goldenmole_dashboard: SUPABASE_URL, SUPABASE_ANON_KEY, CERTIFICATE_PRIVATE_KEY
#    Optional: TESTFLIGHT_URL (public TestFlight link for soft-update prompt)
# 4. Revoke all Apple Distribution certs (Apple limit: 3) before first auto-signing build
#
# Each build: fetch-signing-files --create auto-creates Distribution cert + App Store profile.
# After IPA build: syncs iosLatestVersion / iosLatestBuild into Supabase app_settings.app_defaults
# so installed apps show the soft-update popup.
#
# App Preview (browser simulator): run workflow "Goldenmole Dashboard iOS (Simulator Preview)"
# Docs: https://docs.codemagic.io/yaml-distributing/app-preview/
# Requires App Preview enabled in Codemagic team settings. Click Quick Launch on the .app artifact.

workflows:
  goldenmole-dashboard-ios:
    name: Goldenmole Dashboard iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - goldenmole_dashboard
      vars:
        BUNDLE_ID: "com.goldenmole.dashboard"
        XCODE_PROJECT: "ios-swiftui/GoldenmoleDashboard.xcodeproj"
        XCODE_SCHEME: "GoldenmoleDashboard"
        APP_STORE_APPLE_ID: 6790311737
      xcode: latest
    scripts:
      - name: Install XcodeGen and generate Xcode project
        script: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty."
            echo "Add them to env group goldenmole_dashboard in the SAME account/team that owns this app."
            echo "(Env groups do not move with the app when it is transferred to a team.)"
            exit 1
          fi
          brew install xcodegen
          cd "$CM_BUILD_DIR/ios-swiftui"
          # xcconfig treats // as a comment, so https://... would be cut to
          # "https:". Escape it as https:/$()/ which Xcode resolves back.
          XCCONFIG_SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | sed 's|//|/$()/|')
          XCCONFIG_TESTFLIGHT_URL=""
          if [ -n "${TESTFLIGHT_URL:-}" ]; then
            XCCONFIG_TESTFLIGHT_URL=$(printf '%s' "$TESTFLIGHT_URL" | sed 's|//|/$()/|')
          fi
          APP_STORE_ID_VALUE="${APP_STORE_APPLE_ID:-}"
          cat > Config/Secrets.xcconfig <<EOF
          SUPABASE_URL = $XCCONFIG_SUPABASE_URL
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY
          TESTFLIGHT_URL = $XCCONFIG_TESTFLIGHT_URL
          APP_STORE_ID = $APP_STORE_ID_VALUE
          EOF
          xcodegen generate
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Create and fetch signing files automatically
        script: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is missing from group goldenmole_dashboard."
            echo "One-time setup:"
            echo "  1. Revoke ALL Distribution certs: https://developer.apple.com/account/resources/certificates/list"
            echo "  2. Git Bash: openssl genrsa 2048"
            echo "  3. Codemagic → goldenmole_dashboard → add CERTIFICATE_PRIVATE_KEY (secure)"
            echo "     Paste full PEM including -----BEGIN RSA PRIVATE KEY----- lines. No quotes."
            exit 1
          fi
          CERT_KEY_PATH="$HOME/cert_key.pem"
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          if ! openssl rsa -in "$CERT_KEY_PATH" -check -noout 2>/dev/null; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is invalid. Regenerate with: openssl genrsa 2048"
            exit 1
          fi
          if ! app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$CERT_KEY_PATH"; then
            echo ""
            echo "If you see error 409: revoke ALL Apple Distribution certs, then rebuild."
            echo "https://developer.apple.com/account/resources/certificates/list"
            exit 1
          fi
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios-swiftui"
          # Optional: set MARKETING_VERSION in Codemagic env to bump CFBundleShortVersionString
          if [ -n "${MARKETING_VERSION:-}" ]; then
            echo "Setting marketing version to $MARKETING_VERSION"
            agvtool new-marketing-version "$MARKETING_VERSION"
          fi
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          LATEST_BUILD_NUMBER=${LATEST_BUILD_NUMBER:-0}
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$BUILD_NUMBER
          fi
          echo "Latest uploaded build: $LATEST_BUILD_NUMBER -> setting CFBundleVersion to $NEW_BUILD_NUMBER"
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          echo "Marketing: $(agvtool what-marketing-version -terse1 2>/dev/null || true)"
          agvtool what-version -terse
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Sync soft-update version to Supabase
        script: |
          set -euo pipefail
          # Writes iosLatestVersion / iosLatestBuild (+ optional iosTestFlightURL) into
          # app_settings.app_defaults so installed clients can soft-prompt for TestFlight.
          # Runs after IPA is built (version is final). TestFlight processing may lag a few minutes.
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          cd "$CM_BUILD_DIR/ios-swiftui"
          MARKETING=$(agvtool what-marketing-version -terse1 2>/dev/null | tail -1 | tr -d '[:space:]' || true)
          BUILD=$(agvtool what-version -terse 2>/dev/null | tr -d '[:space:]' || true)
          if [ -z "${MARKETING:-}" ]; then
            MARKETING=$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed 's/.*:[[:space:]]*//' | tr -d '"' || true)
          fi
          MARKETING=${MARKETING:-1.0.0}
          BUILD=${BUILD:-1}
          TF_URL="${TESTFLIGHT_URL:-}"
          echo "Publishing soft-update channel: version=$MARKETING build=$BUILD testflight=${TF_URL:-"(none)"}"

          RESP=$(curl -sS \
            "${SUPABASE_URL}/rest/v1/app_settings?id=eq.default&select=app_defaults" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          if ! echo "$RESP" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "ERROR: unexpected Supabase response when reading app_settings:"
            echo "$RESP"
            exit 1
          fi

          MERGED=$(echo "$RESP" | jq -c \
            --arg v "$MARKETING" \
            --arg b "$BUILD" \
            --arg u "$TF_URL" \
            '
              (.[0].app_defaults // {}) as $d
              | $d
              | .iosLatestVersion = $v
              | .iosLatestBuild = $b
              | if ($u | length) > 0 then .iosTestFlightURL = $u else . end
            ')

          PAYLOAD=$(jq -nc --argjson d "$MERGED" '{app_defaults: $d}')

          HTTP_CODE=$(curl -sS -o /tmp/supabase_patch_body.txt -w "%{http_code}" -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_settings?id=eq.default" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Supabase PATCH failed (HTTP $HTTP_CODE)"
            cat /tmp/supabase_patch_body.txt || true
            exit 1
          fi
          echo "OK: app_settings.app_defaults updated for soft-update prompt"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kraittisak2022@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-expire the previous build stuck in beta review so the new
        # submission never fails with 422 "Another build is in review".
        expire_build_submitted_for_review: true

  goldenmole-dashboard-ios-preview:
    name: Goldenmole Dashboard iOS (Simulator Preview)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - goldenmole_dashboard
      vars:
        XCODE_PROJECT: "ios-swiftui/GoldenmoleDashboard.xcodeproj"
        XCODE_SCHEME: "GoldenmoleDashboard"
      xcode: latest
    scripts:
      - name: Install XcodeGen and generate Xcode project
        script: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty."
            echo "Add them to env group goldenmole_dashboard in the SAME account/team that owns this app."
            exit 1
          fi
          brew install xcodegen
          cd "$CM_BUILD_DIR/ios-swiftui"
          XCCONFIG_SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | sed 's|//|/$()/|')
          cat > Config/Secrets.xcconfig <<EOF
          SUPABASE_URL = $XCCONFIG_SUPABASE_URL
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY
          EOF
          xcodegen generate
      - name: Build for iOS Simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios-swiftui"
          # -derivedDataPath pins the output location so the artifact glob
          # below always matches and Codemagic shows the Quick Launch button.
          xcodebuild build \
            -project GoldenmoleDashboard.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/simulator-build" \
            CODE_SIGNING_ALLOWED=NO
          echo "Simulator .app artifacts:"
          ls -d "$CM_BUILD_DIR"/simulator-build/Build/Products/Debug-iphonesimulator/*.app
    artifacts:
      - simulator-build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------------
  # GoldenMole for User (Flutter) — App Store / TestFlight
  # Bundle ID: com.goldenmole.app  ·  Display name: GoldenMole for User
  # Setup: docs/codemagic-user-ios-setup.md
  # ---------------------------------------------------------------------------
  goldenmole-user-ios:
    name: GoldenMole for User iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        # Shared with Dashboard — only one Codemagic env group
        - goldenmole_dashboard
      vars:
        BUNDLE_ID: "com.goldenmole.app"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        # Optional: set USER_APP_STORE_APPLE_ID in group goldenmole_dashboard
        # (Apple ID of GoldenMole for User — not the Dashboard app)
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Write Flutter .env from secrets
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY missing from env group goldenmole_dashboard."
            exit 1
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "LINE_ADVANCE_NOTIFY_USER_IDS=${LINE_ADVANCE_NOTIFY_USER_IDS:-}"
            echo "NOTIFY_ADVANCE_INVOKER_SECRET=${NOTIFY_ADVANCE_INVOKER_SECRET:-}"
          } > .env
          echo "Wrote mobile-flutter/.env for asset bundling."
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Create and fetch signing files automatically
        script: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is missing from group goldenmole_dashboard."
            echo "See docs/codemagic-setup.md / docs/codemagic-user-ios-setup.md."
            exit 1
          fi
          CERT_KEY_PATH="$HOME/cert_key.pem"
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_PATH"
          if ! openssl rsa -in "$CERT_KEY_PATH" -check -noout 2>/dev/null; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is invalid. Regenerate with: openssl genrsa 2048"
            exit 1
          fi
          if ! app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$CERT_KEY_PATH"; then
            echo ""
            echo "If you see error 409: revoke ALL Apple Distribution certs, then rebuild."
            echo "Also create App ID $BUNDLE_ID in Apple Developer → Identifiers."
            echo "https://developer.apple.com/account/resources/identifiers/list"
            exit 1
          fi
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          flutter precache --ios
          cd ios
          pod install --repo-update
      - name: Flutter build ipa
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          BUILD_NUMBER_ARG=""
          # Prefer User app id so we never reuse Dashboard's APP_STORE_APPLE_ID from yaml/vars
          ASC_APP_ID="${USER_APP_STORE_APPLE_ID:-}"
          if [ -n "$ASC_APP_ID" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$ASC_APP_ID" 2>/dev/null || true)
            LATEST_BUILD_NUMBER=${LATEST_BUILD_NUMBER:-0}
            NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
            if [ "${BUILD_NUMBER:-0}" -gt "$NEW_BUILD_NUMBER" ]; then
              NEW_BUILD_NUMBER=$BUILD_NUMBER
            fi
            echo "Using CFBundleVersion / --build-number=$NEW_BUILD_NUMBER (User ASC $ASC_APP_ID)"
            BUILD_NUMBER_ARG="--build-number=$NEW_BUILD_NUMBER"
          else
            echo "USER_APP_STORE_APPLE_ID not set — using pubspec build number."
          fi
          # shellcheck disable=SC2086
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            $BUILD_NUMBER_ARG
    artifacts:
      - mobile-flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kraittisak2022@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload IPA only. Set true after filling TestFlight Test Information once:
        # https://appstoreconnect.apple.com/apps/6806747374/testflight/test-info
        # (Feedback Email + Beta App Review contact). External testing needs that form.
        # When enabling submit_to_testflight, also set expire_build_submitted_for_review: true
        # so a prior beta-review build does not block the new submission (422).
        submit_to_testflight: false

  goldenmole-user-ios-preview:
    name: GoldenMole for User iOS (Simulator Preview)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - goldenmole_dashboard
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Write Flutter .env from secrets
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY missing from env group goldenmole_dashboard."
            exit 1
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "LINE_ADVANCE_NOTIFY_USER_IDS=${LINE_ADVANCE_NOTIFY_USER_IDS:-}"
            echo "NOTIFY_ADVANCE_INVOKER_SECRET=${NOTIFY_ADVANCE_INVOKER_SECRET:-}"
          } > .env
      - name: Get Flutter packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          flutter precache --ios
          cd ios
          pod install --repo-update
      - name: Build for iOS Simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-flutter"
          flutter build ios --debug --simulator --no-codesign
          echo "Simulator .app:"
          find build/ios -name "*.app" -type d | head -20
    artifacts:
      - mobile-flutter/build/ios/iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
