# Goldenmole Dashboard — Codemagic iOS workflow
# Docs: https://docs.codemagic.io/yaml-code-signing/signing-ios/
# Setup guide: docs/codemagic-setup.md
#
# One-time setup:
# 1. App ID com.goldenmole.dashboard in Apple Developer → Identifiers
# 2. Team integrations → Developer Portal → API key named "codemagic"
# 3. Env group goldenmole_dashboard: SUPABASE_URL, SUPABASE_ANON_KEY, CERTIFICATE_PRIVATE_KEY
# 4. Revoke all Apple Distribution certs (Apple limit: 3) before first auto-signing build
#
# Each build: fetch-signing-files --create auto-creates Distribution cert + App Store profile.

workflows:
  goldenmole-dashboard-ios:
    name: Goldenmole Dashboard iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - goldenmole_dashboard
      vars:
        BUNDLE_ID: "com.goldenmole.dashboard"
        XCODE_PROJECT: "ios-swiftui/GoldenmoleDashboard.xcodeproj"
        XCODE_SCHEME: "GoldenmoleDashboard"
        APP_STORE_APPLE_ID: 6790311737
      xcode: latest
    scripts:
      - name: Install XcodeGen and generate Xcode project
        script: |
          brew install xcodegen
          cd "$CM_BUILD_DIR/ios-swiftui"
          cat > Config/Secrets.xcconfig <<EOF
          SUPABASE_URL = $SUPABASE_URL
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY
          EOF
          xcodegen generate
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Create and fetch signing files automatically
        script: |
          set -e
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is missing from group goldenmole_dashboard."
            echo "One-time setup:"
            echo "  1. Revoke all Distribution certs: https://developer.apple.com/account/resources/certificates/list"
            echo "  2. Git Bash: openssl genrsa 2048"
            echo "  3. Codemagic → goldenmole_dashboard → add CERTIFICATE_PRIVATE_KEY (secure)"
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios-swiftui"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - kraittisak2022@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
