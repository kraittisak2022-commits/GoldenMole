# Copy to codemagic.secrets.yaml (gitignored) and fill values.
# Sync to Codemagic: .\scripts\sync-codemagic-env.ps1
groups:
  goldenmole_dashboard:
    secure: true
    variables:
      - name: SUPABASE_URL
        value: "https://your-project.supabase.co"
      - name: SUPABASE_ANON_KEY
        value: "your_anon_key_here"
      - name: CERTIFICATE_PRIVATE_KEY
        value: |
          -----BEGIN RSA PRIVATE KEY-----
          paste output of: openssl genrsa 2048
          -----END RSA PRIVATE KEY-----
      # Optional — Apple ID of "GoldenMole for User" (Flutter), not Dashboard
      - name: USER_APP_STORE_APPLE_ID
        value: "numeric_user_app_store_connect_apple_id"
      - name: LINE_ADVANCE_NOTIFY_USER_IDS
        value: ""
      - name: NOTIFY_ADVANCE_INVOKER_SECRET
        value: ""
